name: Identity proof
# Spike: master's copy runs on workflow_run and posts a check with the built-in token.
on:
  workflow_run:
    workflows: [Identity trigger]
    types: [completed]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "::notice title=stamphog-marker::{\"head_sha\":\"$HEAD_SHA\",\"via\":\"annotation\"}"
          echo "marker via step summary for $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$REPO/check-runs" \
            -f name='Identity proof (workflow_run)' -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=proved' -f "output[summary]=<!-- stamphog:v1 {\"head_sha\":\"$HEAD_SHA\"} -->" \
            --jq '{id,check_suite_id:.check_suite.id,app:.app.slug,details_url,external_id}'
