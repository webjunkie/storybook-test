name: oidc-rename
on:
  pull_request:
permissions: {}
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/134804434777" -f name=publish --jq '{id, name}'
