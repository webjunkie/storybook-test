name: Identity patch
# Spike: can a plain pull_request job's GITHUB_TOKEN add an annotation to ANOTHER run's job check run?
on:
  pull_request:
permissions: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: '134742468878'
        run: |
          gh api --method PATCH "repos/$REPO/check-runs/$TARGET" \
            -f 'output[title]=patched' -f 'output[summary]=patched by another run' \
            -f 'output[annotations][][path]=README.md' -F 'output[annotations][][start_line]=1' -F 'output[annotations][][end_line]=1' \
            -f 'output[annotations][][annotation_level]=notice' -f 'output[annotations][][title]=stamphog-marker' \
            -f 'output[annotations][][message]={"forged":true}' --jq '{id,name,title:.output.title,annotations:.output.annotations_count}' || echo "PATCH refused"
