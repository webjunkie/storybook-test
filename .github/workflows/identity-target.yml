name: Identity target
# Spike: pull_request_target posts a check on the PR head with the built-in token.
on:
  pull_request_target:
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/check-runs" \
            -f name='Identity proof (pull_request_target)' -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=proved' -f "output[summary]=<!-- stamphog:v1 {\"head_sha\":\"$HEAD_SHA\"} -->" \
            --jq '{id,check_suite_id:.check_suite.id,app:.app.slug}'
