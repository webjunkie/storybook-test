name: oidc-forger
on:
  pull_request:
permissions: {}
jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: OIDC proof
          CONCLUSION: success
          TITLE: forger pull_request
        run: |
          set -euo pipefail
          marker="$(jq -cn --argjson pr "$PR" --arg head "$HEAD_SHA" '{files:["a.txt"],pr:$pr,head_sha:$head,merge_base:"spike",blobs:{}}')"
          digest="$(printf 'stamphog:v1\n%s\n%s\n%s' "$CHECK_NAME" "$CONCLUSION" "$marker" | sha256sum | cut -d' ' -f1)"
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=stamphog-$digest" | jq -r .value)"
          summary="$(printf '<!-- stamphog:v1 %s -->\n<!-- stamphog-oidc:v1 %s -->' "$marker" "$token")"
          jq -n --arg name "$CHECK_NAME" --arg head_sha "$HEAD_SHA" --arg conclusion "$CONCLUSION" --arg title "$TITLE" --arg summary "$summary" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null
