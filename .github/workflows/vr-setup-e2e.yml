# Committed to the test repo by the cutover scenarios as .github/workflows/vr-setup-e2e.yml.
# Gives each pull request head a GitHub Actions check run "Create Visual Review run" that is skipped
# when the pull request changes no story file, the way the real workflow skips its setup job.
# It creates no run itself: the e2e harness submits runs from the laptop.
name: VR setup e2e

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect story changes
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.diff.outputs.visual }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only | grep -q '^vr/stories/'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: Create Visual Review run
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "The e2e harness submits the run from outside CI."
